<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>日報アプリ 物件メモ PDFオフライン試験</title>
<style>html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f7fa}#bar{box-sizing:border-box;background:#0e3b56;color:white;padding:9px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:6px}#bar button{padding:5px 10px;border:1px solid #a8d2e8;border-radius:6px;background:#fff;color:#0e3b56;font-weight:700}#frame{border:0;display:block;width:100%;height:calc(100dvh - 44px)}#error{padding:22px;line-height:1.8}</style></head><body>
<div id="bar"><strong>物件メモPDF・外部ライブラリ不要 / QA</strong><button id="reload" type="button">再読み込み</button></div>
<div id="error" hidden></div><iframe id="frame" title="物件メモPDF・テスト用日報アプリ"></iframe>
<script>
'use strict';
// QA harness only. Loads the QA app from the same origin and inherits its isolated data.
const modalCode = String.raw`
// Offline A4 PDF: render Japanese using system fonts onto JPEG pages, then embed into a minimal PDF.
function makeMemoPDF(siteName,memoText){
 const width=1240,height=1754,marginX=100,marginBottom=115;
 const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
 const ctx=canvas.getContext('2d',{alpha:false});if(!ctx)throw Error('Canvasを使えへんかった');
 const images=[];let y;
 function page(){
  if(images.length>=100)throw Error('ページ数が多すぎるで（最大100ページ）');
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,width,height);
  ctx.fillStyle='#153b52';ctx.font='bold 43px -apple-system, "Hiragino Kaku Gothic ProN", sans-serif';
  ctx.fillText('物件メモ',marginX,120);
  ctx.fillStyle='#d4e0e7';ctx.fillRect(marginX,144,width-marginX*2,3);
  ctx.fillStyle='#172b40';ctx.font='bold 33px -apple-system, "Hiragino Kaku Gothic ProN", sans-serif';
  y=210;
  writeWrapped('物件名：'+siteName,ctx.font,47);
  ctx.fillStyle='#5f7182';ctx.font='24px -apple-system, "Hiragino Kaku Gothic ProN", sans-serif';
  const dt=new Date();ctx.fillText('出力日：'+dt.getFullYear()+'/'+String(dt.getMonth()+1).padStart(2,'0')+'/'+String(dt.getDate()).padStart(2,'0'),marginX,y+12);
  y+=61;
  ctx.fillStyle='#d4e0e7';ctx.fillRect(marginX,y,width-marginX*2,2);y+=51;
  ctx.fillStyle='#172b40';ctx.font='30px -apple-system, "Hiragino Kaku Gothic ProN", sans-serif';
 }
 function endPage(){
  // PDF image data is JPEG, so Japanese glyphs are rasterized before PDF packaging.
  const base64=canvas.toDataURL('image/jpeg',0.90).split(',')[1];
  if(!base64)throw Error('PDF用の画像が作成できへんかった');
  images.push(atob(base64));
 }
 function writeWrapped(text,font,lineHeight){
  ctx.font=font;
  let line='';
  for(const char of Array.from(text)){
   if(char==='\r')continue;
   if(char==='\n'){
    if(y+lineHeight>height-marginBottom){endPage();page();ctx.font=font}
    if(line)ctx.fillText(line,marginX,y);
    y+=lineHeight;line='';continue;
   }
   if(ctx.measureText(line+char).width>width-marginX*2 && line){
    if(y+lineHeight>height-marginBottom){endPage();page();ctx.font=font}
    ctx.fillText(line,marginX,y);y+=lineHeight;line='';
   }
   line+=char;
  }
  if(line){if(y+lineHeight>height-marginBottom){endPage();page();ctx.font=font}ctx.fillText(line,marginX,y);y+=lineHeight}
 }
 // Page header should not recursively wrap itself beyond a full page.
 page();
 writeWrapped(memoText,'30px -apple-system, "Hiragino Kaku Gothic ProN", sans-serif',47);
 endPage();
 if(images.length===0)throw Error('PDFに含めるページが作れへんかった');
 const encoder=new TextEncoder();
 const chunks=[];let total=0;const offsets=[0];
 function pushBytes(bytes){chunks.push(bytes);total+=bytes.length}
 function pushStr(s){pushBytes(encoder.encode(s))}
 function startObj(n){offsets[n]=total;pushStr(n+' 0 obj\n')}
 pushStr('%PDF-1.4\n% Offline-Memo\n');
 const pageCount=images.length;
 // 1 catalog, 2 pages root, 3.. objects in pairs (page, image, content).
 startObj(1);pushStr('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
 const pageIds=images.map((_,i)=>3+i*3);
 startObj(2);pushStr('<< /Type /Pages /Kids ['+pageIds.map(i=>i+' 0 R').join(' ') +'] /Count '+pageCount+' >>\nendobj\n');
 for(let i=0;i<pageCount;i++){
  const p=3+i*3,img=p+1,content=p+2;
  startObj(p);pushStr('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im'+i+' '+img+' 0 R >> >> /Contents '+content+' 0 R >>\nendobj\n');
  const raw=images[i],data=new Uint8Array(raw.length);
  for(let k=0;k<raw.length;k++)data[k]=raw.charCodeAt(k);
  startObj(img);pushStr('<< /Type /XObject /Subtype /Image /Width '+width+' /Height '+height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+data.length+' >>\nstream\n');pushBytes(data);pushStr('\nendstream\nendobj\n');
  const stream='q\n595.28 0 0 841.89 0 0 cm\n/Im'+i+' Do\nQ\n';
  startObj(content);pushStr('<< /Length '+encoder.encode(stream).length+' >>\nstream\n'+stream+'endstream\nendobj\n');
 }
 const xref=total,objCount=3+pageCount*3;
 pushStr('xref\n0 '+objCount+'\n0000000000 65535 f \n');
 for(let i=1;i<objCount;i++)pushStr(String(offsets[i]).padStart(10,'0')+' 00000 n \n');
 pushStr('trailer\n<< /Size '+objCount+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');
 return new Blob(chunks,{type:'application/pdf'});
}
function openSiteMemo(site){
 const current=db.sites.find(x=>x.id===site.id);
 if(!current){alert('この物件が見つからへんで。再読み込みしてな');return}
 const shade=document.createElement('div');shade.setAttribute('role','presentation');
 Object.assign(shade.style,{position:'fixed',inset:'0',zIndex:'99999',background:'rgba(0,0,0,.55)',display:'flex',alignItems:'center',justifyContent:'center',padding:'14px'});
 const dialog=document.createElement('section');dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.setAttribute('aria-label','物件メモ');
 Object.assign(dialog.style,{boxSizing:'border-box',background:'#fff',borderRadius:'12px',width:'min(100%,640px)',maxHeight:'90dvh',overflow:'auto',padding:'20px',boxShadow:'0 14px 32px #0004',color:'#172b40'});
 const h=document.createElement('h2');h.textContent='物件メモ';h.style.margin='0 0 8px';
 const p=document.createElement('p');p.textContent=current.name;p.style.fontWeight='bold';p.style.overflowWrap='anywhere';
 const desc=document.createElement('p');desc.textContent='メモは終了・保管しても残るで。PDFは入力中の内容で作成する。';desc.style.fontSize='13px';
 const area=document.createElement('textarea');area.value=typeof current.memo==='string'?current.memo:'';area.maxLength=10000;area.placeholder='例：残工事、注意事項、次回の申し送り、材料手配など';area.setAttribute('aria-label','物件メモ本文');
 Object.assign(area.style,{boxSizing:'border-box',display:'block',width:'100%',minHeight:'190px',padding:'12px',border:'1px solid #aebdc9',borderRadius:'8px',font:'16px/1.6 -apple-system,BlinkMacSystemFont,sans-serif',resize:'vertical'});
 const count=document.createElement('p');count.style.cssText='font-size:12px;text-align:right;color:#667;margin:6px 0';const updateCount=()=>count.textContent=area.value.length+' / 10000文字';area.addEventListener('input',updateCount);updateCount();
 const row=document.createElement('div');row.style.cssText='display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap';
 const make=(txt,color)=>{const b=document.createElement('button');b.type='button';b.textContent=txt;b.style.cssText='border:1px solid #aaa;border-radius:8px;padding:11px 15px;font-weight:bold;font-size:15px;cursor:pointer;background:'+color;return b};
 const cancel=make('キャンセル','#f6f7f8'),save=make('メモを保存','#c9ebff'),pdf=make('📄 PDFに出力','#e4f4e5');
 pdf.onclick=()=>{
  const text=area.value;
  if(!text.trim()){alert('メモが空やで。文章を入力してな');return}
  const old=pdf.textContent;pdf.disabled=true;pdf.textContent='PDFを作成中…';
  try{
   const blob=makeMemoPDF(current.name,text);
   const filename='物件メモ_'+current.name.replace(/[\\/:*?"<>|\r\n]/g,'_').slice(0,55)+'_'+new Date().toISOString().slice(0,10)+'.pdf';
   const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.target='_blank';document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(err){alert('PDF作成に失敗したで：'+err.message)}finally{pdf.disabled=false;pdf.textContent=old}
 };
 cancel.onclick=()=>shade.remove();
 save.onclick=()=>{const old=current.memo;current.memo=area.value;if(persist()){shade.remove();renderLists();renderArchive();toast('物件メモを保存したで')}else current.memo=old};
 row.append(pdf,cancel,save);dialog.append(h,p,desc,area,count,row);shade.append(dialog);document.body.append(shade);
 shade.addEventListener('click',e=>{if(e.target===shade)shade.remove()});
 const onEscape=e=>{if(e.key==='Escape'){shade.remove();document.removeEventListener('keydown',onEscape)}};document.addEventListener('keydown',onEscape);
 area.focus();
}
`;
function patch(html){
 const anchor='function renderArchive(){';
 const activeAnchor="if(status==='active')acts.append(button(s.specNo?";
 const activeInsert="acts.append(button(s.memo?'📝 メモあり':'📝 メモ',()=>openSiteMemo(s)));";
 const archiveAnchor="item.append(actions);panel.append(item)}}";
 if(!html.includes(anchor)||!html.includes(activeAnchor)||!html.includes(archiveAnchor))throw Error('QA版の構造が変わったため、安全にメモ機能を組み込めへんかった');
 html=html.replace(anchor,modalCode+'\n'+anchor);
 html=html.replace(activeAnchor,activeInsert+activeAnchor);
 html=html.replace(archiveAnchor,"actions.append(button(site.memo?'📝 メモあり':'📝 メモ',()=>openSiteMemo(site)));"+archiveAnchor);
 html=html.replace(/Ver\.17\.3\.(?:8|9) QA/g,'Ver.17.3.15 QA（メモPDF・ライブラリ不要）');
 html=html.replace(/<head>/i,'<head><base href="'+new URL('./',location.href).href+'">');
 return html;
}
async function start(){
 try{
  const response=await fetch('./index.html?v=memo-offline-17315-'+Date.now(),{cache:'no-store'});
  if(!response.ok)throw Error('QA本体の取得に失敗したで（HTTP '+response.status+'）');
  const html=patch(await response.text());
  document.getElementById('frame').srcdoc=html;
  document.getElementById('frame').hidden=false;
  document.getElementById('error').hidden=true;
 }catch(e){const error=document.getElementById('error');error.hidden=false;error.textContent='テスト版を起動できへんかった：'+e.message;document.getElementById('frame').hidden=true}
}
document.getElementById('reload').addEventListener('click',start);start();
</script></body></html>
